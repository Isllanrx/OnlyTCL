[workspace]

[package]
name = "claudetv-rtk"
version = "0.1.0"
edition = "2024"

[lib]
name = "claudetv_rtk"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
